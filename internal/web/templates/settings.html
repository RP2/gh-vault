{{define "content"}}
<section>

    {{if eq .Reason "token_missing"}}
    <div class="alert" role="alert">
        <p><strong>GitHub token required.</strong> Please add a valid GitHub personal access token below to enable syncing and backups.</p>
    </div>
    {{end}}

    <article class="card">
        <h2>General</h2>
        <form method="POST" action="/settings">
            <input type="hidden" name="csrf" value="{{.CSRFToken}}">
            <div class="form-group">
                <label for="cron_schedule">Sync schedule (cron expression)</label>
                <input type="text" id="cron_schedule" name="cron_schedule" value="{{.Settings.CronSchedule}}" title="Cron expression that controls how often gh-vault syncs with GitHub">
            </div>
            <div class="form-group">
                <label for="log_retention_days">Keep logs for N days</label>
                <input type="number" id="log_retention_days" name="log_retention_days" value="{{.Settings.LogRetentionDays}}" title="Number of days to keep log entries before they are deleted">
            </div>
            <button type="submit" title="Save general settings">Save Settings</button>
        </form>
    </article>

    <article class="card">
        <h2>GitHub Token</h2>
        <form method="POST" action="/settings/token">
            <input type="hidden" name="csrf" value="{{.CSRFToken}}">
            <div class="form-group">
                <label for="token">New Token</label>
                <input type="password" id="token" name="token" title="GitHub personal access token used to list repositories">
            </div>
            <button type="submit" title="Save GitHub personal access token">Save Token</button>
        </form>
    </article>
</section>
{{end}}
