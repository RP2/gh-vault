{{define "content"}}
<section>

    {{if eq .Reason "token_missing"}}
    <div class="alert" role="alert">
        <p><strong>GitHub token required.</strong> Please add a valid GitHub personal access token below to enable syncing and backups.</p>
    </div>
    {{end}}

    <article class="card">
        <h2>General</h2>
        <form method="POST" action="/settings">
            <input type="hidden" name="csrf" value="{{.CSRFToken}}">
            <div class="form-group">
                <label for="cron_schedule">Cron Schedule</label>
                <input type="text" id="cron_schedule" name="cron_schedule" value="{{.Settings.CronSchedule}}">
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="dry_run" value="on" id="dry_run" {{if .Settings.DryRun}}checked{{end}}>
                    Dry Run
                </label>
            </div>
            <div class="form-group">
                <label for="auto_archive_days">Auto-archive Days</label>
                <input type="number" id="auto_archive_days" name="auto_archive_days" value="{{.Settings.AutoArchiveDays}}">
            </div>
            <div class="form-group">
                <label for="log_retention_days">Log Retention Days</label>
                <input type="number" id="log_retention_days" name="log_retention_days" value="{{.Settings.LogRetentionDays}}">
            </div>
            <button type="submit">Save Settings</button>
        </form>
    </article>

    <article class="card">
        <h2>GitHub Token</h2>
        <form method="POST" action="/settings/token">
            <input type="hidden" name="csrf" value="{{.CSRFToken}}">
            <div class="form-group">
                <label for="token">New Token</label>
                <input type="password" id="token" name="token">
            </div>
            <button type="submit">Save Token</button>
        </form>
    </article>
</section>
{{end}}
