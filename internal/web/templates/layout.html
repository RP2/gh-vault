<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{.CSRFToken}}">
    <title>gh-vault</title>
    <link rel="stylesheet" href="/static/tailwind.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/app.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <nav class="bg-gray-900 text-white">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-lg font-semibold tracking-tight">gh-vault</a>
            <div class="flex items-center gap-4 text-sm">
                <a href="/" class="hover:text-gray-300">Dashboard</a>
                <a href="/repos" class="hover:text-gray-300">Repos</a>
                <a href="/logs" class="hover:text-gray-300">Logs</a>
                <a href="/settings" class="hover:text-gray-300">Settings</a>
                <form method="POST" action="/logout" class="inline">
                    <input type="hidden" name="csrf" value="{{.CSRFToken}}">
                    <button type="submit" class="hover:text-gray-300">Logout</button>
                </form>
            </div>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto p-4">
        {{template "content" .}}
    </main>
</body>
</html>
