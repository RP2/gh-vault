{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{.CSRFToken}}">
    <title>gh-vault</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/app.js"></script>
</head>
<body>
    {{if .CSRFToken}}
    <nav class="nav" aria-label="Main">
        <a href="/" {{if eq .CurrentPath "/"}}class="active"{{end}}>Dashboard</a>
        <a href="/repos" {{if eq .CurrentPath "/repos"}}class="active"{{end}}>Repos</a>
        <a href="/logs" {{if eq .CurrentPath "/logs"}}class="active"{{end}}>Logs</a>
        <a href="/settings" {{if eq .CurrentPath "/settings"}}class="active"{{end}}>Settings</a>
        <form method="POST" action="/logout" data-confirm="Sign out of gh-vault?">
            <input type="hidden" name="csrf" value="{{.CSRFToken}}">
            <button type="submit" title="Log out of gh-vault">Logout</button>
        </form>
    </nav>
    {{end}}
    <main>
        {{template "content" .}}
    </main>
</body>
</html>
{{end}}
