{{define "content"}}
<p>{{.RepoCount}} repos tracked · {{.BackedUp}} backed up · {{.NotBackedUp}} not backed up</p>
<p>
  <button hx-post="/sync" hx-swap="none">Sync Now</button>
  <button hx-post="/backup-all" hx-swap="none">Backup All</button>
</p>

{{if .RecentLogs}}
<h2>Recent Activity</h2>
<table>
  <thead><tr><th>When</th><th>Action</th><th>Detail</th></tr></thead>
  <tbody>
    {{range .RecentLogs}}
    <tr>
      <td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
      <td>{{.Action}}</td>
      <td>{{.Message}}</td>
    </tr>
    {{end}}
  </tbody>
</table>
{{end}}
{{end}}
