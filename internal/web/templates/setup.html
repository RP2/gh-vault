{{define "content"}}
<div class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded shadow w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6">Setup gh-vault</h1>
        {{if .Error}}
        <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-4 text-sm">
            {{.Error}}
        </div>
        {{end}}
        <form method="POST" action="/setup" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" name="username" class="mt-1 w-full border rounded px-3 py-2" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" class="mt-1 w-full border rounded px-3 py-2" required minlength="8">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Create Account</button>
        </form>
    </div>
</div>
{{end}}
