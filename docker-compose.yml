services:
  gh-vault:
    image: ghcr.io/RP2/gh-vault:main
    container_name: gh-vault
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "568:568"  # chown host volumes to this UID:GID
    ports:
      - "8090:8090"
    volumes:
      - /path/to/config:/config      # your host path for app state
      - /path/to/backups:/backups     # your host path for repo backups
    tmpfs:
      - /tmp:size=100m,noexec,nosuid
      - /run:size=10m,noexec,nosuid
    environment:
      - PORT=8090
      - DATA_DIR=/config
      - BACKUP_DIR=/backups
      # - DISABLE_TLS=true   # Uncomment for plain HTTP (e.g. behind a reverse proxy)
      # - BASE_URL=http://localhost:8090  # Set to your public URL. Use https:// for secure cookies.
      # - ENCRYPTION_KEY=                  # 32 bytes base64. Auto-generated if not set.
      # - TZ=America/New_York              # Local time for cron schedules and displayed timestamps (default: UTC)
      #
      # Production notes:
      # - When behind a reverse proxy, set DISABLE_TLS=true and configure TLS at the proxy.
      # - Provide ENCRYPTION_KEY via Docker secret or env var; do not rely on auto-generation.
      # - Rate limiting is in-memory and resets on restart; configure it at the proxy layer.
      # - For uptime monitoring, point your monitor at /healthz (unauthenticated, not request-logged).
    logging:
      # Cap container logs so they cannot grow without bound on the host.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
