name: Security Scan

# govulncheck examines the dependency tree, not the code: a monthly cadence
# catches newly published vulns without generating noise on a mostly dormant
# project. Dep changes and PRs scan immediately; GitHub's Dependabot alerts
# remain the always-on backstop.
on:
  schedule:
    - cron: "0 13 1 * *"
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
